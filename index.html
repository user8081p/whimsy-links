
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>WHIMSY SHOP</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 25%, #401018, #09090d 70%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 390px;
  text-align: center;
}

.tag {
  color: #ff4654;
  font-size: 11px;
  letter-spacing: 6px;
  margin-bottom: 30px;
}

.mascot {
  width: 220px;
  height: 220px;
  margin: auto auto 25px;
  border-radius: 50%;
  background: radial-gradient(circle, #49121b, #110b10);
  box-shadow: 0 0 65px #ff263b30;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.mascot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

h1 {
  font-size: 34px;
  letter-spacing: 5px;
  font-weight: 900;
  text-shadow: 0 0 20px #ff263b66;
}

.subtitle {
  color: #aaa1a5;
  font-size: 10px;
  letter-spacing: 3px;
  margin: 13px 0 38px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.link {
  padding: 19px;
  border: 1px solid #ffffff25;
  border-radius: 15px;
  background: linear-gradient(110deg, #19171d, #271116);
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  transition: .25s;
}

.link:hover {
  border-color: #ff4654;
  box-shadow: 0 0 25px #ff263b40;
  transform: translateY(-3px);
}

.link span {
  color: #ff4654;
  margin-right: 12px;
}

.footer {
  color: #716a73;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 40px;
}
</style>
</head>

<body>
<main class="container">

  <div class="tag">WELCOME TO</div>

  <div class="mascot">
    <img src="whimsy.png" alt="WHIMSY">
  </div>

  <h1>WHIMSY SHOP</h1>

  <p class="subtitle">A LITTLE WORLD OF WONDER</p>

  <div class="links">

    <a class="link" href="https://t.me/YOUR_CHANNEL">
      <span>✦</span> TELEGRAM
    </a>

    <a class="link" href="https://rubika.ir/YOUR_CHANNEL">
      <span>✦</span> RUBIKA
    </a>

  </div>

  <div class="footer">THE WORLD OF WHIMSY</div>

</main>
</body>
</html>
